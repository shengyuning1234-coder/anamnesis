[supervisord]
nodaemon=true
logfile=/dev/null
pidfile=/tmp/anamnesis-supervisord.pid

[program:vocabulary]
command=/opt/anamnesis-venv/bin/python -u web_server.py
directory=/opt/anamnesis
autostart=true
autorestart=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
stopasgroup=true
killasgroup=true

[program:openwebui]
command=/bin/bash /app/backend/start.sh
directory=/app/backend
environment=PORT="8080",HOST="0.0.0.0",DATA_DIR="/data/openwebui"
autostart=true
autorestart=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
stopasgroup=true
killasgroup=true
